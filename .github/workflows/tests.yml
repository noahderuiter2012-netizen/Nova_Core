name: Python tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feat/github-branch-pr-workflow-20261025"

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip fastapi pydantic
      - name: Run programming-agent regression tests
        run: python -m unittest discover -s tests -v
