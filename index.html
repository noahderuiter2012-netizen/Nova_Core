<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .nova {
            width: 90%;
            max-width: 600px;
            background: #1f2937;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        h1 {
            margin-top: 0;
        }

        #messages {
            height: 350px;
            overflow-y: auto;
            background: #111827;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .message {
            margin: 10px 0;
        }

        .user {
            color: #60a5fa;
        }

        .nova-message {
            color: #34d399;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="nova">
    <h1>🤖 Nova</h1>

    <div id="messages">
        <div class="message nova-message">
            Nova: Hello! Nova Core is online.
        </div>
    </div>

    <div class="input-row">
        <input id="messageInput" placeholder="Talk to Nova...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
function sendMessage() {
    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");

    const text = input.value.trim();

    if (!text) return;

    messages.innerHTML += `
        <div class="message user">
            You: ${text}
        </div>
    `;

    input.value = "";

    messages.innerHTML += `
        <div class="message nova-message">
            Nova: I received your message.
        </div>
    `;

    messages.scrollTop = messages.scrollHeight;
}
</script>

</body>
</html>
