<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at 50% 20%, #12345a 0%, #07111f 35%, #02060c 75%);
            color: white;
            overflow: hidden;
        }

        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* TOP BAR */

        .topbar {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            background: rgba(5, 15, 28, 0.65);
            border-bottom: 1px solid rgba(80, 180, 255, 0.15);
            backdrop-filter: blur(20px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: bold;
        }

        .logo {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background:
                radial-gradient(circle, #ffffff 0%, #6ee7ff 15%, #168cff 45%, #071a35 75%);
            box-shadow:
                0 0 15px #168cff,
                0 0 35px rgba(22, 140, 255, 0.6);
        }

        .status {
            font-size: 13px;
            color: #6ee7ff;
        }

        /* MAIN */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* NOVA CORE */

        .nova-core {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            position: relative;
            margin-bottom: 30px;

            background:
                radial-gradient(
                    circle,
                    #ffffff 0%,
                    #8be9ff 8%,
                    #168cff 30%,
                    #092b55 55%,
                    #020b18 75%
                );

            box-shadow:
                0 0 25px #168cff,
                0 0 60px rgba(22, 140, 255, 0.65),
                0 0 120px rgba(22, 140, 255, 0.3);

            animation: pulse 3s infinite ease-in-out;
        }

        .nova-core::before,
        .nova-core::after {
            content: "";
            position: absolute;
            inset: -18px;
            border: 1px solid rgba(80, 200, 255, 0.35);
            border-radius: 50%;
            animation: rotate 8s linear infinite;
        }
