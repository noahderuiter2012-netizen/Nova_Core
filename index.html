<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .nova {
            width: 90%;
            max-width: 600px;
            background: #1f2937;
            padding: 25px;
            border-radius: 20px;
        }

        #messages {
            height: 350px;
            overflow-y: auto;
            background: #111827;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .message {
            margin: 10px 0;
        }

        .user {
            color: #60a5fa;
        }

        .nova-message {
            color: #34d399;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="nova">
    <h1>🤖 Nova</h1>

    <div id="messages">
        <div class="message nova-message">
            Nova: Hello! Nova Core is online.
        </div>
    </div>

    <div class="input-row">
        <input
            id="messageInput"
            type="text"
            placeholder="Talk to Nova..."
        >

        <button id="sendButton" type="button">
            Send
        </button>
    </div>
</div>

<script>
const input = document.getElementById("messageInput");
const button = document.getElementById("sendButton");
const messages = document.getElementById("messages");

async function sendMessage() {
    const text = input.value.trim();

    if (!text) return;

    messages.innerHTML += `
        <div class="message user">
            You: ${text}
        </div>
    `;

    input.value = "";

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: text
            })
        });

        if (!response.ok) {
            throw new Error("Server error");
        }

        const data = await response.json();

        messages.innerHTML += `
            <div class="message nova-message">
                Nova: ${data.reply}
            </div>
        `;
    } catch (error) {
        messages.innerHTML += `
            <div class="message nova-message">
                Nova: Connection error.
            </div>
        `;
    }

    messages.scrollTop = messages.scrollHeight;
}

button.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
