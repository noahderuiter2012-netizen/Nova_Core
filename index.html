<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background: #020812;
        }

        .app {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 50% 25%,
                    rgba(0, 150, 255, 0.45),
                    transparent 35%
                ),
                linear-gradient(
                    180deg,
                    #061426 0%,
                    #020812 100%
                );
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 70px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(2, 10, 20, 0.75);
            border-bottom: 1px solid rgba(80, 190, 255, 0.2);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: bold;
        }

        .logo {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: radial-gradient(
                circle,
                white 0%,
                #6ee7ff 20%,
                #168cff 55%,
                #062047 100%
            );
            box-shadow:
                0 0 15px #168cff,
                0 0 40px rgba(0, 150, 255, 0.7);
        }

        .status {
            color: #6ee7ff;
            font-size: 14px;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 45px 20px 30px;
        }

        .core {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(
                circle,
                white 0%,
                #8be9ff 8%,
                #168cff 30%,
                #07366b 60%,
                #020812 100%
            );
            box-shadow:
                0 0 30px #168cff,
                0 0 80px rgba(0, 150, 255, 0.65);
            margin-bottom: 35px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
            text-align: center;
        }

        .subtitle {
            margin: 10px 0 30px;
            color: #91a9c2;
            text-align: center;
        }

        .chat {
            width: 100%;
            max-width: 700px;
            padding: 16px;
            border-radius: 20px;
            background: rgba(8, 25, 45, 0.85);
            border: 1px solid rgba(80, 190, 255, 0.25);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        #messages {
            height: 240px;
            overflow-y: auto;
            padding: 8px;
        }

        .message {
            padding: 12px 14px;
            margin-bottom: 10px;
            border-radius: 12px;
            line-height: 1.4;
        }

        .nova-message {
            background: rgba(0, 180, 255, 0.08);
            border: 1px solid rgba(80, 200, 255, 0.15);
        }

        .user {
            background: rgba(40, 120, 220, 0.2);
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(80, 190, 255, 0.25);
            background: #020b16;
            color: white;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            background: #168cff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .core {
                width: 120px;
                height: 120px;
            }

            h1 {
                font-size: 26px;
            }

            .input-row {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div class="topbar">
        <div class="brand">
            <div class="logo"></div>
            Nova
        </div>

        <div class="status">
            ● Online
        </div>
    </div>

    <main class="main">

        <div class="core"></div>

        <h1>Hello, I'm Nova.</h1>

        <div class="subtitle">
            Your personal AI assistant.
        </div>

        <div class="chat">

            <div id="messages">
                <div class="message nova-message">
                    Nova: I'm online. What can I help you with?
                </div>
            </div>

            <div class="input-row">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Talk to Nova..."
                >

                <button id="sendButton">
                    Send
                </button>

            </div>

        </div>

    </main>

</div>

<script>
const input = document.getElementById("messageInput");
const button = document.getElementById("sendButton");
const messages = document.getElementById("messages");

async function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    messages.innerHTML += `
        <div class="message user">
            You: ${text}
        </div>
    `;

    input.value = "";

    try {

        const response = await fetch("/chat", {
    method: "POST",
    headers: {
        "Content-Type": "application/json",
        "X-Nova-Key": sessionStorage.getItem("novaAccessKey")
    },
    body: JSON.stringify({message: text})
});

        if (!response.ok) {
            throw new Error("Server error");
        }

        const data = await response.json();

        messages.innerHTML += `
            <div class="message nova-message">
                Nova: ${data.reply}
            </div>
        `;

    } catch (error) {

        messages.innerHTML += `
            <div class="message nova-message">
                Nova: Connection error.
            </div>
        `;
    }

    messages.scrollTop = messages.scrollHeight;
}

button.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
