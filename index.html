<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nova</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at center,
                    #07152b 0%,
                    #020712 45%,
                    #00030a 100%
                );
            color: #eaf7ff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .app {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 230px;
            padding: 24px 18px;
            background: rgba(3, 10, 22, 0.75);
            border-right: 1px solid rgba(0, 180, 255, 0.15);
            backdrop-filter: blur(20px);
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #7cddff;
            margin-bottom: 35px;
        }

        .side-item {
            padding: 13px;
            margin-bottom: 8px;
            border-radius: 12px;
            color: #91a9ba;
        }

        .side-item.active {
            color: #e8faff;
            background: rgba(0, 150, 255, 0.12);
        }

        /* MAIN */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .topbar {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            border-bottom: 1px solid rgba(0, 180, 255, 0.1);
        }

        .status {
            color: #6fdcff;
            font-size: 13px;
        }

        .status::before {
            content: "";
            display: inline-block;
            width: 7px;
            height: 7px;
            margin-right: 8px;
            border-radius: 50%;
            background: #4de1ff;
            box-shadow: 0 0 12px #4de1ff;
        }

        /* CHAT */

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            padding-bottom: 170px;
        }

        .message {
            max-width: 850px;
            margin: 0 auto 18px auto;
            padding: 15px 18px;
            border-radius: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user {
            background: rgba(0, 120, 255, 0.15);
            border: 1px solid rgba(0, 150, 255, 0.18);
        }

        .nova {
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(120, 200, 255, 0.08);
        }

        /* ORB */

        .orb-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 190px;
            height: 190px;
            pointer-events: none;
            opacity: 0.75;
        }

        .orb {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: 80px;
            height: 80px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #e8fbff,
                    #42cfff 20%,
                    #087cff 55%,
                    #003b9e 100%
                );

            box-shadow:
                0 0 20px #16baff,
                0 0 50px rgba(0, 160, 255, 0.8),
                0 0 100px rgba(0, 100, 255, 0.45);

            transition: 0.3s;
        }

        .ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(50, 190, 255, 0.3);
            border-radius: 50%;
        }

        .ring.one {
            width: 115px;
            height: 115px;
        }

        .ring.two {
            width: 150px;
            height: 150px;
        }

        .ring.three {
            width: 190px;
            height: 190px;
        }

        .thinking .orb {
            animation: pulse 1.2s infinite;
        }

        .thinking .ring.one {
            animation: rotate 3s linear infinite;
        }

        .thinking .ring.two {
            animation: rotateReverse 4s linear infinite;
        }

        .thinking .ring.three {
            animation: rotate 6s linear infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.15);
            }
        }

        @keyframes rotate {
            from {
                transform:
                    translate(-50%, -50%)
                    rotate(0deg);
            }

            to {
                transform:
                    translate(-50%, -50%)
                    rotate(360deg);
            }
        }

        @keyframes rotateReverse {
            from {
                transform:
                    translate(-50%, -50%)
                    rotate(360deg);
            }

            to {
                transform:
                    translate(-50%, -50%)
                    rotate(0deg);
            }
        }

        /* INPUT */

        .input-area {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: min(900px, calc(100% - 30px));
            z-index: 10;
        }

        .preview {
            display: none;
            margin-bottom: 10px;
            position: relative;
            width: 120px;
        }

        .preview.show {
            display: block;
        }

        .preview img {
            width: 120px;
            height: 90px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid rgba(70, 190, 255, 0.4);
        }

        #removePhoto {
            position: absolute;
            right: -8px;
            top: -8px;

            width: 24px;
            height: 24px;

            border: none;
            border-radius: 50%;

            background: #10243a;
            color: white;

            cursor: pointer;
        }

        .input-box {
            display: flex;
            align-items: center;
            gap: 8px;

            padding: 9px;

            background: rgba(5, 15, 30, 0.92);
            border: 1px solid rgba(80, 180, 255, 0.2);

            border-radius: 18px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 10px 50px rgba(0, 0, 0, 0.4);
        }

        #messageInput {
            flex: 1;

            min-width: 0;

            border: none;
            outline: none;

            background: transparent;

            color: white;

            font-size: 16px;

            padding: 12px;
        }

        button {
            flex-shrink: 0;

            width: 43px;
            height: 43px;

            border: none;
            border-radius: 13px;

            background: rgba(30, 120, 200, 0.15);

            color: #a9eaff;

            cursor: pointer;

            font-size: 18px;

            transition: 0.2s;
        }

        button:hover {
            background: rgba(30, 150, 255, 0.3);
        }

        #sendButton {
            background: linear-gradient(
                135deg,
                #087cff,
                #14c8ff
            );

            color: white;

            box-shadow:
                0 0 20px rgba(0, 150, 255, 0.35);
        }

        input[type="file"] {
            display: none;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .sidebar {
                display: none;
            }

            .topbar {
                padding: 0 15px;
            }

            #chat {
                padding: 15px;
            }

            .orb-container {
                transform:
                    translate(-50%, -50%)
                    scale(0.8);
            }

            .input-area {
                width: calc(100% - 20px);
                bottom: 10px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            NOVA
        </div>

        <div class="side-item active">
            Chat
        </div>

        <div class="side-item">
            Memory
        </div>

        <div class="side-item">
            Tools
        </div>

        <div class="side-item">
            Developer
        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <div class="topbar">

            <div>
                Nova
            </div>

            <div class="status">
                Online
            </div>

        </div>


        <!-- ORB -->

        <div
            id="orbContainer"
            class="orb-container"
        >

            <div class="ring one"></div>
            <div class="ring two"></div>
            <div class="ring three"></div>

            <div class="orb"></div>

        </div>


        <!-- CHAT -->

        <div id="chat"></div>


        <!-- INPUT -->

        <div class="input-area">

            <!-- PHOTO PREVIEW -->

            <div
                id="photoPreview"
                class="preview"
            >

                <img
                    id="previewImage"
                    src=""
                    alt="Selected image"
                >

                <button
                    id="removePhoto"
                    type="button"
                >
                    ×
                </button>

            </div>


            <div class="input-box">

                <!-- PHOTO -->

                <button
                    id="photoButton"
                    type="button"
                    title="Add photo"
                >
                    📷
                </button>

                <input
                    id="photoInput"
                    type="file"
                    accept="image/*"
                >


                <!-- VOICE -->

                <button
                    id="voiceButton"
                    type="button"
                    title="Voice input"
                >
                    🎙️
                </button>


                <!-- TEXT -->

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Talk to Nova..."
                    autocomplete="off"
                >


                <!-- SEND -->

                <button
                    id="sendButton"
                    type="button"
                    title="Send"
                >
                    ➤
                </button>

            </div>

        </div>

    </main>

</div>


<script>

    const chat =
        document.getElementById("chat");

    const input =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const voiceButton =
        document.getElementById("voiceButton");

    const photoButton =
        document.getElementById("photoButton");

    const photoInput =
        document.getElementById("photoInput");

    const photoPreview =
        document.getElementById("photoPreview");

    const previewImage =
        document.getElementById("previewImage");

    const removePhoto =
        document.getElementById("removePhoto");

    const orbContainer =
        document.getElementById("orbContainer");


    let selectedPhoto = null;


    // =========================
    // ADD MESSAGE
    // =========================

    function addMessage(
        text,
        type
    ) {

        const message =
            document.createElement("div");

        message.className =
            "message " + type;

        message.textContent =
            text;

        chat.appendChild(message);

        chat.scrollTop =
            chat.scrollHeight;
    }


    // =========================
    // THINKING
    // =========================

    function setThinking(
        thinking
    ) {

        if (thinking) {

            orbContainer.classList.add(
                "thinking"
            );

        } else {

            orbContainer.classList.remove(
                "thinking"
            );

        }
    }


    // =========================
    // PHOTO BUTTON
    // =========================

    photoButton.addEventListener(
        "click",
        function () {

            photoInput.click();

        }
    );


    // =========================
    // PHOTO SELECTED
    // =========================

    photoInput.addEventListener(
        "change",
        function () {

            const file =
                photoInput.files[0];

            if (!file) {
                return;
            }

            selectedPhoto = file;

            const imageURL =
                URL.createObjectURL(file);

            previewImage.src =
                imageURL;

            photoPreview.classList.add(
                "show"
            );

        }
    );


    // =========================
    // REMOVE PHOTO
    // =========================

    removePhoto.addEventListener(
        "click",
        function () {

            selectedPhoto = null;

            photoInput.value = "";

            previewImage.src = "";

            photoPreview.classList.remove(
                "show"
            );

        }
    );


    // =========================
    // SEND MESSAGE
    // =========================

    async function sendMessage() {

        const text =
            input.value.trim();


        // Nothing to send
        if (!text && !selectedPhoto) {
            return;
        }


        // Show user's message
        if (text) {

            addMessage(
                text,
                "user"
            );

        } else {

            addMessage(
                "📷 Image",
                "user"
            );

        }


        input.value = "";

        setThinking(true);


        try {

            /*
             * ========================
             * IMAGE MODE
             * ========================
             */

            if (selectedPhoto) {

                const reader =
                    new FileReader();


                reader.onload =
                    async function () {

                        const imageData =
                            reader.result;


                        try {

                            const response =
                                await fetch(
                                    "/vision",
                                    {
                                        method: "POST",

                                        headers: {
                                            "Content-Type":
                                                "application/json"
                                        },

                                        body:
                                            JSON.stringify({
                                                message:
                                                    text ||
                                                    "Describe this image.",

                                                image:
                                                    imageData
                                            })
                                    }
                                );


                            if (!response.ok) {

                                const errorText =
                                    await response.text();

                                throw new Error(
                                    errorText ||
                                    "Vision request failed."
                                );

                            }


                            const data =
                                await response.json();


                            addMessage(
                                data.reply ||
                                "I couldn't analyze that image.",
                                "nova"
                            );


                        } catch (error) {

                            console.error(
                                "Vision error:",
                                error
                            );

                            addMessage(
                                "I couldn't analyze the image. Check the Render logs for the vision error.",
                                "nova"
                            );

                        } finally {

                            selectedPhoto =
                                null;

                            photoInput.value =
                                "";

                            previewImage.src =
                                "";

                            photoPreview.classList.remove(
                                "show"
                            );

                            setThinking(false);
                        }

                    };


                reader.readAsDataURL(
                    selectedPhoto
                );


                return;
            }


            /*
             * ========================
             * NORMAL CHAT MODE
             * ========================
             */

            const response =
                await fetch(
                    "/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                message: text
                            })
                    }
                );


            if (!response.ok) {

                const errorText =
                    await response.text();

                throw new Error(
                    errorText ||
                    "Chat request failed."
                );

            }


            const data =
                await response.json();


            addMessage(
                data.reply ||
                "I didn't receive a response.",
                "nova"
            );


        } catch (error) {

            console.error(
                "Chat error:",
                error
            );

            addMessage(
                "I couldn't connect to Nova.",
                "nova"
            );

        } finally {

            setThinking(false);

        }

    }


    // =========================
    // SEND BUTTON
    // =========================

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    // =========================
    // ENTER KEY
    // =========================

    input.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    // =========================
    // VOICE INPUT
    // =========================

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (SpeechRecognition) {

        const recognition =
            new SpeechRecognition();

        recognition.lang =
            "en-US";
