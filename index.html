<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 38%, rgba(0,120,255,.18), transparent 32%),
        #020711;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.app {
    min-height: 100vh;
    display: flex;
}

/* SIDEBAR */

.sidebar {
    width: 220px;
    border-right: 1px solid rgba(0,150,255,.2);
    background: rgba(1,7,17,.8);
    padding: 25px 15px;
}

.logo {
    font-size: 27px;
    letter-spacing: 7px;
    font-weight: bold;
    margin: 5px 15px 40px;
}

.logo span {
    color: #00d9ff;
    text-shadow: 0 0 20px #00d9ff;
}

.nav {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.nav button {
    border: 1px solid transparent;
    background: transparent;
    color: #91a4bd;
    padding: 14px;
    border-radius: 13px;
    text-align: left;
    cursor: pointer;
}

.nav button:hover,
.nav button.active {
    background: rgba(0,120,255,.12);
    border-color: rgba(0,150,255,.2);
    color: white;
}

.profile {
    position: absolute;
    bottom: 20px;
    width: 190px;
    padding: 14px;
    border-radius: 15px;
    border: 1px solid rgba(0,150,255,.2);
    background: rgba(5,20,40,.6);
}

.profile-name {
    font-weight: bold;
}

.profile-sub {
    color: #71859f;
    font-size: 12px;
    margin-top: 4px;
}

/* MAIN */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.topbar {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 25px;
    border-bottom: 1px solid rgba(0,150,255,.12);
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #a9bad0;
    font-size: 13px;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2dff9b;
    box-shadow: 0 0 12px #2dff9b;
}

/* WORKSPACE */

.workspace {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* NOVA CORE */

.core-container {
    width: 300px;
    height: 300px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: -10px;
}

.core {
    width: 145px;
    height: 145px;
    border-radius: 50%;
    position: relative;
    z-index: 5;

    background:
        radial-gradient(
            circle at 32% 25%,
            #eaffff 0%,
            #6beeff 8%,
            #159cff 25%,
            #0751c7 48%,
            #031c58 72%,
            #010817 100%
        );

    border: 1px solid rgba(150,240,255,.9);

    box-shadow:
        inset 10px 8px 20px rgba(220,255,255,.35),
        inset -20px -25px 35px rgba(0,5,35,.8),
        0 0 30px rgba(0,220,255,.8),
        0 0 70px rgba(0,110,255,.55),
        0 0 120px rgba(0,80,255,.25);

    animation: float 4s ease-in-out infinite;
}

.core::before {
    content: "";
    position: absolute;
    width: 180px;
    height: 42px;
    left: -18px;
    top: 55px;
    border-radius: 50%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(0,220,255,.3),
        rgba(180,250,255,.75),
        rgba(0,150,255,.3),
        transparent
    );

    filter: blur(7px);
    transform: rotate(-18deg);
    animation: energy 3s ease-in-out infinite;
}

.core::after {
    content: "";
    position: absolute;
    width: 55px;
    height: 30px;
    left: 30px;
    top: 20px;
    border-radius: 50%;
    background: rgba(235,255,255,.45);
    filter: blur(9px);
    transform: rotate(-25deg);
}

/* RINGS */

.ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(0,170,255,.4);
}

.ring.one {
    width: 205px;
    height: 205px;
    border-left-color: transparent;
    border-bottom-color: transparent;
    animation: rotate 10s linear infinite;
}

.ring.two {
    width: 250px;
    height: 250px;
    border-right-color: transparent;
    border-top-color: transparent;
    animation: rotateReverse 13s linear infinite;
}

.ring.three {
    width: 285px;
    height: 285px;
    border-left-color: transparent;
    border-right-color: transparent;
    opacity: .35;
    animation: rotate 18s linear infinite;
}

/* ANIMATIONS */

@keyframes float {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-9px);
    }
}

@keyframes rotate {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes rotateReverse {
    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

@keyframes energy {
    0%,100% {
        transform: translateX(-8px) rotate(-18deg);
    }

    50% {
        transform: translateX(8px) rotate(-18deg);
    }
}

/* GREETING */

.greeting {
    text-align: center;
    margin-bottom: 20px;
}

.greeting h1 {
    margin: 0 0 8px;
    font-size: 30px;
}

.greeting h1 span {
    color: #159cff;
    text-shadow: 0 0 15px rgba(0,150,255,.6);
}

.greeting p {
    margin: 0;
    color: #8194ad;
}

/* CHAT */

.chat-area {
    width: min(750px, 90%);
}

.input {
    display: flex;
    gap: 10px;
    padding: 8px;

    border-radius: 30px;

    border: 1px solid rgba(0,157,255,.65);

    background: rgba(3,17,36,.9);

    box-shadow:
        0 0 25px rgba(0,105,255,.12);
}

input {
    flex: 1;
    min-width: 0;

    padding: 13px;

    border: none;
    outline: none;

    background: transparent;

    color: white;
    font-size: 15px;
}

input::placeholder {
    color: #71859f;
}

button.send {
    width: 46px;
    height: 46px;

    border: none;
    border-radius: 50%;

    background: linear-gradient(
        145deg,
        #28a7ff,
        #006eea
    );

    color: white;
    font-size: 20px;

    cursor: pointer;

    box-shadow: 0 0 20px rgba(0,135,255,.5);
}

button.send:disabled {
    opacity: .5;
}

#result {
    margin-top: 15px;
    padding: 18px;

    border-radius: 15px;

    background: rgba(3,15,30,.75);

    border: 1px solid rgba(0,140,255,.15);

    color: #dce9f8;

    line-height: 1.5;

    white-space: pre-wrap;

    display: none;

    max-height: 180px;
    overflow-y: auto;
}

/* MOBILE */

@media (max-width: 700px) {

    .sidebar {
        display: none;
    }

    .workspace {
        padding: 15px;
    }

    .core-container {
        transform: scale(.78);
        margin-top: -30px;
        margin-bottom: -35px;
    }

    .greeting h1 {
        font-size: 26px;
    }

    .chat-area {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            N<span>O</span>VA
        </div>

        <div class="nav">

            <button class="active">
                ◉ &nbsp; Chat
            </button>

            <button>
                ✦ &nbsp; Memories
            </button>

            <button>
                ⚙ &nbsp; Tools
            </button>

            <button>
                ◈ &nbsp; Settings
            </button>

        </div>

        <div class="profile">

            <div class="profile-name">
                Noah
            </div>

            <div class="profile-sub">
                My personal AI
            </div>

        </div>

    </aside>

    <main class="main">

        <div class="topbar">

            <div class="status">

                <div class="status-dot"></div>

                Nova Online

            </div>

        </div>

        <section class="workspace">

            <div class="core-container">

                <div class="ring one"></div>
                <div class="ring two"></div>
                <div class="ring three"></div>

                <div class="core"></div>

            </div>

            <div class="greeting">

                <h1>
                    Hello, <span>Noah.</span>
                </h1>

                <p>
                    Your personal AI assistant is ready.
                </p>

            </div>

            <div class="chat-area">

                <div class="input">

                    <input
                        id="message"
                        type="text"
                        placeholder="Ask Nova anything..."
                        autocomplete="off"
                    >

                    <button
                        id="send"
                        class="send"
                        type="button"
                    >
                        ↑
                    </button>

                </div>

                <div id="result"></div>

            </div>

        </section>

    </main>

</div>

<script>

const message =
    document.getElementById("message");

const send =
    document.getElementById("send");

const result =
    document.getElementById("result");


send.addEventListener("click", async function() {

    const text =
        message.value.trim();

    if (!text) {

        result.textContent =
            "Type something first.";

        result.style.display =
            "block";

        return;
    }

    send.disabled = true;

    send.textContent =
        "...";

    result.textContent =
        "Nova is thinking...";

    result.style.display =
        "block";

    try {

        const response =
            await fetch("/chat", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    message: text
                })

            });

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Nova returned an error."
            );

        }

        result.textContent =
            data.reply;

    } catch (error) {

        result.textContent =
            "Error: " +
            error.message;

    } finally {

        send.disabled = false;

        send.textContent =
            "↑";

    }

});


message.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            send.click();
        }

    }
);

</script>

</body>
</html>
