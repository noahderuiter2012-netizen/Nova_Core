<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #020711;
    --panel: rgba(5, 17, 34, 0.78);
    --blue: #078cff;
    --cyan: #00d9ff;
    --text: #f4f8ff;
    --muted: #8292aa;
    --border: rgba(0, 153, 255, 0.22);
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 65% 40%, rgba(0, 95, 190, 0.16), transparent 35%),
        radial-gradient(circle at 50% 100%, rgba(0, 100, 255, 0.12), transparent 40%),
        var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

.app {
    height: 100vh;
    display: flex;
}

/* SIDEBAR */

.sidebar {
    width: 235px;
    border-right: 1px solid var(--border);
    background: rgba(1, 7, 17, 0.82);
    backdrop-filter: blur(20px);
    display: flex;
    flex-direction: column;
    padding: 24px 14px;
}

.logo {
    font-size: 27px;
    letter-spacing: 7px;
    font-weight: 600;
    margin: 3px 15px 38px;
    color: #d9ecff;
}

.logo span {
    color: var(--cyan);
    text-shadow: 0 0 18px var(--cyan);
}

.nav {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.nav-button {
    border: 1px solid transparent;
    background: transparent;
    color: #aab9cf;
    border-radius: 15px;
    padding: 14px 18px;
    text-align: left;
    font-size: 15px;
    cursor: pointer;
}

.nav-button:hover,
.nav-button.active {
    background: rgba(0, 115, 255, 0.13);
    border-color: rgba(0, 150, 255, 0.2);
    color: white;
    box-shadow: inset 3px 0 0 var(--blue);
}

.profile {
    margin-top: auto;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 17px;
    background: rgba(5, 20, 40, 0.6);
}

.profile-name {
    font-weight: bold;
    margin-bottom: 4px;
}

.profile-sub {
    color: var(--muted);
    font-size: 12px;
}

/* MAIN */

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.topbar {
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    border-bottom: 1px solid rgba(0, 140, 255, 0.13);
}

.status {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 15px;
    border-radius: 20px;
    background: rgba(0, 110, 255, 0.1);
    border: 1px solid rgba(0, 140, 255, 0.16);
    font-size: 13px;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2dff9b;
    box-shadow: 0 0 12px #2dff9b;
}

.top-actions {
    display: flex;
    gap: 18px;
}

.top-button {
    border: none;
    background: transparent;
    color: #b7c7dd;
    font-size: 22px;
    cursor: pointer;
}

/* CENTER */

.workspace {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
}

.core-container {
    width: 290px;
    height: 290px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: -20px;
}

..core {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    position: relative;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 32% 25%,
            rgba(225, 252, 255, 0.98) 0%,
            rgba(80, 224, 255, 0.95) 8%,
            rgba(16, 117, 255, 0.95) 34%,
            rgba(4, 47, 125, 0.98) 68%,
            rgba(1, 8, 25, 1) 100%
        );

    border: 1px solid rgba(150, 240, 255, 0.75);

    box-shadow:
        inset -18px -20px 35px rgba(0, 5, 30, 0.85),
        inset 15px 12px 28px rgba(160, 245, 255, 0.35),
        0 0 25px rgba(0, 210, 255, 0.95),
        0 0 65px rgba(0, 105, 255, 0.65),
        0 0 120px rgba(0, 80, 255, 0.28);

    animation: float 4s ease-in-out infinite;

    z-index: 3;
}

/* Flowing energy inside Nova */

.core::before {
    content: "";
    position: absolute;

    width: 190px;
    height: 58px;

    left: -20px;
    top: 48px;

    border-radius: 50%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0, 225, 255, 0.85),
            rgba(180, 250, 255, 0.95),
            rgba(0, 150, 255, 0.85),
            transparent
        );

    filter: blur(5px);

    transform:
        rotate(-18deg)
        skewX(-12deg);

    opacity: 0.9;

    animation: energyFlow 3s ease-in-out infinite;
}

/* Inner secondary energy layer */

.core::after {
    content: "";

    position: absolute;

    width: 175px;
    height: 42px;

    left: -12px;
    top: 76px;

    border-radius: 50%;

    border-top: 2px solid rgba(120, 245, 255, 0.9);

    filter: blur(2px);

    transform: rotate(-18deg);

    opacity: 0.7;

    animation: energyFlow 2.4s ease-in-out infinite reverse;
}

@keyframes energyFlow {

    0%, 100% {
        transform:
            translateX(-12px)
            rotate(-18deg)
            scaleX(0.95);
        opacity: 0.55;
    }

    50% {
        transform:
            translateX(12px)
            rotate(-18deg)
            scaleX(1.08);
        opacity: 1;
    }
}
    box-shadow:
        0 0 25px #00cfff,
        0 0 65px rgba(0, 120, 255, .8),
        0 0 120px rgba(0, 100, 255, .35);
    animation: float 4s ease-in-out infinite;
    z-index: 3;
}

.core::after {
    content: "";
    position: absolute;
    width: 75%;
    height: 25%;
    left: 12%;
    top: 45%;
    border-radius: 50%;
    background: rgba(91, 242, 255, .7);
    filter: blur(8px);
    transform: rotate(-20deg);
    opacity: .75;
}

.ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(0, 170, 255, .42);
}

.ring.one {
    width: 210px;
    height: 210px;
    border-left-color: transparent;
    border-bottom-color: transparent;
    animation: rotate 10s linear infinite;
}

.ring.two {
    width: 245px;
    height: 245px;
    border-right-color: transparent;
    border-top-color: transparent;
    animation: rotateReverse 13s linear infinite;
}

.ring.three {
    width: 280px;
    height: 280px;
    border-left-color: transparent;
    border-right-color: transparent;
    opacity: .35;
    animation: rotate 18s linear infinite;
}

.core-dot {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #65ecff;
    box-shadow: 0 0 15px #00d9ff;
}

.dot-one {
    top: 26px;
    right: 42px;
}

.dot-two {
    bottom: 35px;
    left: 30px;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-9px);
    }
}

@keyframes rotate {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes rotateReverse {
    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

/* THINKING */

.thinking .core {
    animation:
        thinkPulse .8s ease-in-out infinite alternate,
        float 2s ease-in-out infinite;
    box-shadow:
        0 0 35px #00e5ff,
        0 0 85px rgba(0, 155, 255, .95),
        0 0 150px rgba(0, 105, 255, .5);
}

.thinking .ring {
    border-color: rgba(0, 220, 255, .7);
}

.thinking .ring.one {
    animation-duration: 2s;
}

.thinking .ring.two {
    animation-duration: 3s;
}

@keyframes thinkPulse {
    from {
        transform: scale(.93);
    }

    to {
        transform: scale(1.08);
    }
}

/* GREETING */

.greeting {
    text-align: center;
    margin-top: -10px;
    margin-bottom: 17px;
}

.greeting h1 {
    font-size: 32px;
    margin: 0 0 8px;
}

.greeting h1 span {
    color: #1c9bff;
}

.greeting p {
    margin: 0;
    color: var(--muted);
}

/* THINKING INDICATOR */

.thinking-indicator {
    height: 34px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 18px;
    border: 1px solid rgba(0, 155, 255, .35);
    border-radius: 22px;
    color: #bcefff;
    background: rgba(0, 90, 190, .12);
    opacity: 0;
    transform: translateY(5px);
    transition: .25s ease;
    pointer-events: none;
    margin-bottom: 14px;
}

.thinking-indicator.visible {
    opacity: 1;
    transform: translateY(0);
}

.dots {
    display: flex;
    gap: 4px;
}

.dots span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--cyan);
    animation: dotPulse 1.2s infinite;
}

.dots span:nth-child(2) {
    animation-delay: .2s;
}

.dots span:nth-child(3) {
    animation-delay: .4s;
}

@keyframes dotPulse {
    0%, 100% {
        opacity: .25;
        transform: translateY(0);
    }

    50% {
        opacity: 1;
        transform: translateY(-3px);
    }
}

/* CHAT */

.chat-area {
    width: min(850px, 100%);
}

.input-box {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 9px 8px 12px;
    border-radius: 30px;
    border: 1px solid rgba(0, 157, 255, .65);
    background: rgba(3, 17, 36, .86);
    box-shadow:
        0 0 25px rgba(0, 105, 255, .1),
        inset 0 0 25px rgba(0, 70, 150, .08);
}

.icon-button {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: #8da6c4;
    font-size: 19px;
    cursor: pointer;
}

.icon-button:hover {
    color: white;
    background: rgba(0, 120, 255, .12);
}

#message {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 15px;
}

#message::placeholder {
    color: #778ba5;
}

.send-button {
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(145deg, #28a7ff, #006eea);
    color: white;
    font-size: 21px;
    cursor: pointer;
    box-shadow: 0 0 22px rgba(0, 135, 255, .55);
}

.send-button:hover {
    transform: scale(1.05);
}

.send-button:disabled {
    opacity: .45;
    cursor: default;
}

/* QUICK ACTIONS */

.quick-actions {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 15px;
}

.quick {
    border: 1px solid rgba(0, 140, 255, .25);
    border-radius: 20px;
    background: rgba(4, 20, 40, .6);
    color: #a8bdd8;
    padding: 9px 15px;
    cursor: pointer;
    font-size: 12px;
}

.quick:hover {
    color: white;
    border-color: rgba(0, 170, 255, .6);
    background: rgba(0, 100, 220, .12);
}

/* RESPONSE */

#response {
    margin-top: 15px;
    width: 100%;
    max-height: 180px;
    overflow-y: auto;
    padding: 15px 18px;
    border-radius: 16px;
    background: rgba(3, 15, 30, .72);
    border: 1px solid rgba(0, 140, 255, .12);
    color: #dce9f8;
    line-height: 1.55;
    white-space: pre-wrap;
    display: none;
}

#response.visible {
    display: block;
}

/* HIDDEN FILE INPUTS */

.hidden-input {
    display: none;
}

/* MOBILE */

@media (max-width: 760px) {

    .sidebar {
        display: none;
    }

    .topbar {
        padding: 0 16px;
    }

    .workspace {
        padding: 10px 14px 18px;
    }

    .core-container {
        transform: scale(.78);
        margin-top: -35px;
        margin-bottom: -35px;
    }

    .greeting h1 {
        font-size: 26px;
    }

    .quick {
        padding: 8px 12px;
    }

    .input-box {
        padding-left: 7px;
    }

    .icon-button {
        width: 34px;
        height: 34px;
    }

    .send-button {
        width: 44px;
        height: 44px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            N<span>O</span>VA
        </div>

        <nav class="nav">
            <button class="nav-button active">◉ &nbsp; Chat</button>
            <button class="nav-button">✦ &nbsp; Memories</button>
            <button class="nav-button">⚙ &nbsp; Tools</button>
            <button class="nav-button">◈ &nbsp; Settings</button>
        </nav>

        <div class="profile">
            <div class="profile-name">Noah</div>
            <div class="profile-sub">My AI companion</div>
        </div>

    </aside>

    <main class="main">

        <header class="topbar">

            <div class="status">
                <div class="status-dot"></div>
                Online
            </div>

            <div class="top-actions">
                <button class="top-button">☼</button>
                <button class="top-button">☰</button>
            </div>

        </header>

        <section class="workspace">

            <div class="core-container" id="coreContainer">

                <div class="ring one"></div>
                <div class="ring two"></div>
                <div class="ring three"></div>

                <div class="core"></div>

                <div class="core-dot dot-one"></div>
                <div class="core-dot dot-two"></div>

            </div>

            <div class="greeting">
                <h1>Hello, <span>Noah.</span></h1>
                <p>Your personal AI assistant is ready.</p>
            </div>

            <div class="thinking-indicator" id="thinkingIndicator">

                <span>Nova is thinking</span>

                <span class="dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>

            </div>

            <div class="chat-area">

                <div class="input-box">

                    <button
                        class="icon-button"
                        id="voiceButton"
                        title="Voice input"
                    >
                        🎙
                    </button>

                    <input
                        id="message"
                        type="text"
                        placeholder="Ask Nova anything..."
                        autocomplete="off"
                    >

                    <button
                        class="icon-button"
                        id="attachButton"
                        title="Attach file"
                    >
                        📎
                    </button>

                    <button
                        class="icon-button"
                        id="photoButton"
                        title="Add photo"
                    >
                        ▧
                    </button>

                    <button
                        class="icon-button"
                        id="videoButton"
                        title="Add video"
                    >
                        ▷
                    </button>

                    <button
                        class="send-button"
                        id="sendButton"
                        title="Send"
                    >
                        ↑
                    </button>

                </div>

                <input
                    class="hidden-input"
                    id="fileInput"
                    type="file"
                >

                <input
                    class="hidden-input"
                    id="photoInput"
                    type="file"
                    accept="image/*"
                >

                <input
                    class="hidden-input"
                    id="videoInput"
                    type="file"
                    accept="video/*"
                >

                <div class="quick-actions">

                    <button class="quick" data-text="Search the web for ">
                        ◉ Search the web
                    </button>

                    <button class="quick" data-text="Calculate ">
                        ▣ Calculate
                    </button>

                    <button class="quick" data-text="Set a timer for ">
                        ◷ Set a timer
                    </button>

                    <button class="quick" data-text="Remember that ">
                        ✦ Remember this
                    </button>

                </div>

                <div id="response"></div>

            </div>

        </section>

    </main>

</div>

<script>
const messageInput = document.getElementById("message");
const sendButton = document.getElementById("sendButton");
const responseBox = document.getElementById("response");
const thinkingIndicator = document.getElementById("thinkingIndicator");
const coreContainer = document.getElementById("coreContainer");

const voiceButton = document.getElementById("voiceButton");
const attachButton = document.getElementById("attachButton");
const photoButton = document.getElementById("photoButton");
const videoButton = document.getElementById("videoButton");

const fileInput = document.getElementById("fileInput");
const photoInput = document.getElementById("photoInput");
const videoInput = document.getElementById("videoInput");


function setThinking(thinking) {

    thinkingIndicator.classList.toggle(
        "visible",
        thinking
    );

    coreContainer.classList.toggle(
        "thinking",
        thinking
    );

    sendButton.disabled = thinking;
}


async function sendMessage() {

    const text = messageInput.value.trim();

    if (!text) {
        return;
    }

    responseBox.textContent = "";
    responseBox.classList.remove("visible");

    setThinking(true);

    try {

        const response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: text
            })

        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.detail || "Nova could not respond."
            );
        }

        responseBox.textContent = data.reply;
        responseBox.classList.add("visible");

    } catch (error) {

        responseBox.textContent =
            "Connection error: " + error.message;

        responseBox.classList.add("visible");

    } finally {

        setThinking(false);

    }
}


sendButton.addEventListener(
    "click",
    sendMessage
);


messageInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    }
);


/* QUICK ACTIONS */

document.querySelectorAll(".quick").forEach(
    button => {

        button.addEventListener(
            "click",
            () => {

                messageInput.value =
                    button.dataset.text;

                messageInput.focus();

            }
        );

    }
);


/* FILE BUTTONS */

attachButton.addEventListener(
    "click",
    () => fileInput.click()
);

photoButton.addEventListener(
    "click",
    () => photoInput.click()
);

videoButton.addEventListener(
    "click",
    () => videoInput.click()
);


photoInput.addEventListener(
    "change",
    () => {

        if (photoInput.files.length > 0) {

            const file =
                photoInput.files[0];

            responseBox.textContent =
                "Photo selected: " + file.name +
                "\n\nImage understanding will be connected next.";

            responseBox.classList.add("visible");
        }

    }
);


videoInput.addEventListener(
    "change",
    () => {

        if (videoInput.files.length > 0) {

            const file =
                videoInput.files[0];

            responseBox.textContent =
                "Video selected: " + file.name +
                "\n\nVideo understanding will be connected next.";

            responseBox.classList.add("visible");
        }

    }
);


fileInput.addEventListener(
    "change",
    () => {

        if (fileInput.files.length > 0) {

            const file =
                fileInput.files[0];

            responseBox.textContent =
                "File selected: " + file.name;

            responseBox.classList.add("visible");
        }

    }
);


/* VOICE INPUT */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (SpeechRecognition) {

    const recognition =
        new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.interimResults = false;

    voiceButton.addEventListener(
        "click",
        () => {

            voiceButton.textContent = "🔴";

            recognition.start();

        }
    );

    recognition.onresult =
        function(event) {

            const transcript =
                event.results[0][0].transcript;

            messageInput.value =
                transcript;

        };

    recognition.onend =
        function() {

            voiceButton.textContent = "🎙";

        };

    recognition.onerror =
        function() {

            voiceButton.textContent = "🎙";

        };

} else {

    voiceButton.addEventListener(
        "click",
        () => {

            responseBox.textContent =
                "Voice input isn't supported by this browser.";

            responseBox.classList.add("visible");

        }
    );

}
</script>

</body>
</html>
