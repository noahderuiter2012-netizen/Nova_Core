<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova</title>

<style>
body {
    margin: 0;
    background: #020711;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    width: min(700px, 90%);
    text-align: center;
}

h1 {
    font-size: 42px;
    color: #00d9ff;
}

p {
    color: #8fa5c0;
}

.input {
    display: flex;
    gap: 10px;
    margin-top: 30px;
}

input {
    flex: 1;
    padding: 16px;
    border-radius: 25px;
    border: 1px solid #008cff;
    background: #071426;
    color: white;
    outline: none;
}

button {
    border: none;
    border-radius: 25px;
    padding: 0 22px;
    background: #078cff;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:active {
    transform: scale(0.95);
}

#result {
    margin-top: 25px;
    padding: 20px;
    border-radius: 15px;
    background: #071426;
    display: none;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<div class="container">

    <h1>NOVA</h1>

    <p>Personal AI assistant</p>

    <div class="input">

        <input
            id="message"
            type="text"
            placeholder="Ask Nova anything..."
        >

        <button
            id="send"
            type="button"
        >
            Send
        </button>

    </div>

    <div id="result"></div>

</div>

<script>

const message =
    document.getElementById("message");

const send =
    document.getElementById("send");

const result =
    document.getElementById("result");


send.addEventListener("click", async function() {

    const text = message.value.trim();

    if (!text) {
        result.textContent = "Type something first.";
        result.style.display = "block";
        return;
    }

    send.disabled = true;
    send.textContent = "Thinking...";

    result.textContent = "Nova is thinking...";
    result.style.display = "block";

    try {

        const response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: text
            })

        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.detail || "Nova returned an error."
            );
        }

        result.textContent = data.reply;

    } catch (error) {

        result.textContent =
            "Error: " + error.message;

    } finally {

        send.disabled = false;
        send.textContent = "Send";

    }

});


message.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        send.click();
    }

});

</script>

</body>
</html>
