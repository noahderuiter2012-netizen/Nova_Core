<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #020712;
            color: white;
            font-family: Arial, sans-serif;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: rgba(5, 15, 30, 0.95);
            border-bottom: 1px solid rgba(50, 180, 255, 0.15);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #67dfff;
        }

        .status {
            color: #5de0ff;
            font-size: 13px;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 130px;
        }

        .message {
            max-width: 800px;
            margin: 0 auto 15px;
            padding: 14px 17px;
            border-radius: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user {
            background: rgba(0, 130, 255, 0.15);
        }

        .nova {
            background: rgba(255, 255, 255, 0.05);
        }

        .orb-area {
            position: fixed;
            left: 50%;
            top: 43%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .orb {
            width: 85px;
            height: 85px;
            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    white,
                    #49d5ff 20%,
                    #087cff 55%,
                    #003b9e
                );

            box-shadow:
                0 0 25px #18bfff,
                0 0 70px rgba(0, 140, 255, 0.7);
        }

        .thinking .orb {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.18);
            }
        }

        .input-area {
            position: fixed;
            left: 50%;
            bottom: 15px;
            transform: translateX(-50%);
            width: min(900px, calc(100% - 20px));
        }

        .preview {
            display: none;
            margin-bottom: 8px;
            position: relative;
            width: 110px;
        }

        .preview.show {
            display: block;
        }

        .preview img {
            width: 110px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
        }

        #removePhoto {
            position: absolute;
            right: -7px;
            top: -7px;
            width: 25px;
            height: 25px;
            padding: 0;
            border-radius: 50%;
        }

        .input-box {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px;

            background: rgba(5, 15, 30, 0.97);
            border: 1px solid rgba(70, 190, 255, 0.25);
            border-radius: 17px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 16px;
            padding: 12px;
        }

        button {
            width: 43px;
            height: 43px;
            flex-shrink: 0;

            border: none;
            border-radius: 12px;

            background: rgba(40, 130, 200, 0.18);
            color: #aeeaff;

            font-size: 18px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.94);
        }

        #sendButton {
            background: #087cff;
            color: white;
        }

        #photoInput {
            display: none;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="topbar">
        <div class="logo">NOVA</div>
        <div class="status">ONLINE</div>
    </div>

    <div id="chat" class="chat"></div>

    <div id="orbArea" class="orb-area">
        <div class="orb"></div>
    </div>

    <div class="input-area">

        <div id="photoPreview" class="preview">

            <img id="previewImage">

            <button
                id="removePhoto"
                type="button"
            >
                ×
            </button>

        </div>

        <div class="input-box">

            <button
                id="photoButton"
                type="button"
            >
                📷
            </button>

            <input
                id="photoInput"
                type="file"
                accept="image/*"
            >

            <button
                id="voiceButton"
                type="button"
            >
                🎙️
            </button>

            <input
                id="messageInput"
                type="text"
                placeholder="Talk to Nova..."
            >

            <button
                id="sendButton"
                type="button"
            >
                ➤
            </button>

        </div>

    </div>

</div>


<script>

console.log("Nova JavaScript loaded");


const chat =
    document.getElementById("chat");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const voiceButton =
    document.getElementById("voiceButton");

const photoButton =
    document.getElementById("photoButton");

const photoInput =
    document.getElementById("photoInput");

const photoPreview =
    document.getElementById("photoPreview");

const previewImage =
    document.getElementById("previewImage");

const removePhoto =
    document.getElementById("removePhoto");

const orbArea =
    document.getElementById("orbArea");


let selectedPhoto = null;


/* =========================
   MESSAGE
========================= */

function addMessage(text, type) {

    const element =
        document.createElement("div");

    element.className =
        "message " + type;

    element.textContent =
        text;

    chat.appendChild(element);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================
   THINKING
========================= */

function thinking(value) {

    if (value) {
        orbArea.classList.add("thinking");
    } else {
        orbArea.classList.remove("thinking");
    }
}


/* =========================
   PHOTO BUTTON
========================= */

photoButton.onclick = function() {

    console.log("Photo button clicked");

    photoInput.click();

};


/* =========================
   PHOTO SELECTED
========================= */

photoInput.onchange = function() {

    const file =
        photoInput.files[0];

    if (!file) {
        return;
    }

    console.log("Photo selected");

    selectedPhoto = file;

    previewImage.src =
        URL.createObjectURL(file);

    photoPreview.classList.add("show");

};


/* =========================
   REMOVE PHOTO
========================= */

removePhoto.onclick = function() {

    selectedPhoto = null;

    photoInput.value = "";

    previewImage.src = "";

    photoPreview.classList.remove("show");

};


/* =========================
   SEND
========================= */

sendButton.onclick = sendMessage;


async function sendMessage() {

    const text =
        input.value.trim();

    if (!text && !selectedPhoto) {
        return;
    }

    if (text) {

        addMessage(
            text,
            "user"
        );

    } else {

        addMessage(
            "📷 Image",
            "user"
        );

    }

    input.value = "";

    thinking(true);


    try {

        /* =====================
           VISION
        ===================== */

        if (selectedPhoto) {

            const reader =
                new FileReader();

            reader.onload = async function() {

                try {

                    const response =
                        await fetch(
                            "/vision",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        message:
                                            text ||
                                            "Describe this image.",

                                        image:
                                            reader.result
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.detail ||
                            "Vision request failed."
                        );

                    }


                    addMessage(
                        data.reply,
                        "nova"
                    );


                } catch (error) {

                    console.error(
                        "Vision error:",
                        error
                    );

                    addMessage(
                        "Vision error: " +
                        error.message,
                        "nova"
                    );

                }


                selectedPhoto = null;

                photoInput.value = "";

                previewImage.src = "";

                photoPreview.classList.remove(
                    "show"
                );

                thinking(false);

            };


            reader.readAsDataURL(
                selectedPhoto
            );

            return;
        }


        /* =====================
           NORMAL CHAT
        ===================== */

        const response =
            await fetch(
                "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message: text
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Chat request failed."
            );

        }


        addMessage(
            data.reply,
            "nova"
        );


    } catch (error) {

        console.error(
            "Chat error:",
            error
        );

        addMessage(
            "Connection error: " +
            error.message,
            "nova"
        );

    }


    thinking(false);

}


/* =========================
   ENTER
========================= */

input.onkeydown = function(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();

    }

};


/* =========================
   VOICE
========================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    const recognition =
        new SpeechRecognition();

    recognition.lang = "en-US";

    recognition.continuous = false;

    recognition.interimResults = false;


    voiceButton.onclick = function() {

        console.log("Voice button clicked");

        recognition.start();

    };


    recognition.onresult =
        function(event) {

            input.value =
                event.results[0][0].transcript;

        };


    recognition.onerror =
        function(event) {

            console.error(
                "Voice error:",
                event.error
            );

        };

} else {

    voiceButton.onclick = function() {

        alert(
            "Voice input is not supported by this browser."
        );

    };

}


console.log("Nova interface ready");

</script>

</body>
</html>
